trigger:
- main

variables:
  dockerRegSC: 'ACRAuth'
  azureSC: 'AzureSC'
  imageRepository: 'devops-demo'
  containerRegistry: 'jaidevopsacr.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'

stages:

- stage: Build
  displayName: 'Build and Push'
  jobs:

  - job: BuildImage
    displayName: 'Build Docker Image'
    pool:
      vmImage: 'ubuntu-latest'

    steps:

    - task: Docker@2
      displayName: 'Build and Push Docker Image'
      inputs:
        command: 'buildAndPush'
        containerRegistry: '$(dockerRegSC)'
        repository: '$(imageRepository)'
        dockerfile: '$(dockerfilePath)'
        tags: |
          $(tag)
          latest


- stage: Deploy
  displayName: 'Deploy to AKS'
  dependsOn: Build
  condition: succeeded()

  jobs:

  - job: DeployToAKS
    displayName: 'Deploy Application'
    pool:
      vmImage: 'ubuntu-latest'

    steps:

    - task: KubernetesManifest@1
      displayName: 'Deploy to AKS'
      inputs:
        action: 'deploy'
        connectionType: 'azureResourceManager'
        azureSubscriptionConnection: '$(azureSC)'
        azureResourceGroup: 'rg-devops-e2e'
        kubernetesCluster: 'jaidevopsaks'
        namespace: 'default'
        manifests: |
          $(Build.SourcesDirectory)/k8s/deployment.yaml
          $(Build.SourcesDirectory)/k8s/service.yaml
        containers: |
          $(containerRegistry)/$(imageRepository):$(tag)