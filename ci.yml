trigger:
- main

variables:
  dockerRegSC: 'ACRAuthTF'
  azureSC: 'AzureSC'
  imageRepository: 'devops-demo'
  containerRegistry: 'jaidevopstflabacr.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'

stages:
- stage: Build
  displayName: 'Build and Push'
  jobs:
  - job: BuildImage
    displayName: 'Build Docker Image'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: Docker@2
      displayName: 'Build and Push Docker Image'
      inputs:
        command: 'buildAndPush'
        containerRegistry: '$(dockerRegSC)'
        repository: '$(imageRepository)'
        dockerfile: '$(dockerfilePath)'
        tags: |
          $(tag)
          latest

- stage: Deploy
  displayName: 'Deploy to AKS'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: DeployToAKS
    displayName: 'Deploy and verify application'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: KubernetesManifest@1
      displayName: 'Deploy to AKS'
      inputs:
        action: 'deploy'
        connectionType: 'azureResourceManager'
        azureSubscriptionConnection: '$(azureSC)'
        azureResourceGroup: 'rg-devops-e2e'
        kubernetesCluster: 'jaidevopsaks'
        namespace: 'default'
        manifests: |
          $(Build.SourcesDirectory)/k8s/deployment.yaml
          $(Build.SourcesDirectory)/k8s/service.yaml
        containers: |
          $(containerRegistry)/$(imageRepository):$(tag)

    - task: AzureCLI@2
      displayName: 'Verify image, rollout, and public health endpoint'
      inputs:
        azureSubscription: '$(azureSC)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -euo pipefail
          az aks get-credentials --resource-group rg-devops-e2e --name jaidevopsaks --overwrite-existing
          kubectl rollout status deployment/devops-demo --namespace default --timeout=180s

          expected='$(containerRegistry)/$(imageRepository):$(tag)'
          actual="$(kubectl get deployment devops-demo --namespace default -o jsonpath='{.spec.template.spec.containers[?(@.name=="devops-demo")].image}')"
          if [[ "$actual" != "$expected" ]]; then
            echo "Unexpected deployed image: $actual (expected $expected)" >&2
            exit 1
          fi

          for attempt in {1..12}; do
            address="$(kubectl get service devops-demo-service --namespace default -o jsonpath='{.status.loadBalancer.ingress[0].ip}')"
            if [[ -z "$address" ]]; then
              address="$(kubectl get service devops-demo-service --namespace default -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')"
            fi
            if [[ -n "$address" ]] && curl --fail --silent --show-error --max-time 5 "http://$address/health"; then
              echo
              echo "Verified $actual at http://$address/health"
              exit 0
            fi
            sleep 10
          done
          echo 'The LoadBalancer health endpoint was not reachable within two minutes.' >&2
          kubectl get service devops-demo-service --namespace default -o wide
          exit 1
